<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Siege FPS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="ui">
      <div id="startScreen" class="overlay">
        <div class="panel">
          <h1>Neon Siege</h1>
          <p>3D FPS shooter built without a game engine.</p>
          <button id="startBtn">Start</button>
          <label class="soundToggle">
            <input id="enableSound" type="checkbox" checked />
            <span>Enable sound</span>
          </label>
        </div>
      </div>

      <div id="pauseScreen" class="overlay hidden">
        <div class="panel small">
          <h2 id="pauseTitle">Paused</h2>
          <button id="resumeBtn">Resume</button>
          <button id="restartBtn">Restart</button>
        </div>
      </div>

      <div id="hud" class="hidden">
        <div id="crosshair">+</div>
        <div id="topbar">
          <div id="score">Score: <span id="scoreVal">0</span></div>
          <div id="wave">Wave: <span id="waveVal">1</span></div>
        </div>
        <div id="health">HP: <span id="hp">100</span></div>
        <div id="ammo">Ammo: <span id="ammoVal">∞</span></div>
        <div id="hint">Click to lock pointer. WASD to move. Space to jump. Left click to shoot. Esc to pause.</div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
