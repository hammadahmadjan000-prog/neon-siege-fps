<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Neon Siege FPS - Upgraded Starter</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="ui">
    <div id="startScreen" class="overlay">
      <h1>Neon Siege</h1>
      <p>3D FPS — no game engine. Built with Three.js.</p>
      <button id="startBtn">Start</button>
      <label><input type="checkbox" id="enableSound" checked/> Enable sound</label>
    </div>

    <div id="pauseScreen" class="overlay hidden">
      <h2>Paused</h2>
      <button id="resumeBtn">Resume</button>
      <button id="restartBtn">Restart</button>
    </div>

    <div id="hud" class="hidden">
      <div id="crosshair">+</div>
      <div id="topbar">
        <div id="score">Score: <span id="scoreVal">0</span></div>
        <div id="wave">Wave: <span id="waveVal">0</span></div>
      </div>
      <div id="health">HP: <span id="hp">100</span></div>
      <div id="ammo">Ammo: <span id="ammoVal">∞</span></div>
      <div id="hint">Click to lock pointer. WASD to move. Left click to shoot. ESC to unlock.</div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
